[tool.poetry]
name = "pt750"
version = "0.3.0"
description = "label printing tools for brother PT-P750W label maker"
authors = ["rpedde <ron@pedde.com>"]
license = "GPL3"

[tool.poetry.dependencies]
python = "^3.12"
Pillow = "^10.0.0"
treepoem = "^3.0.0"
fastapi = "^0.104.0"
Jinja2 = "^3.1.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
PyYAML = "^6.0"
pysnmp = "^7.1.14"
opencv-python = "^4.11.0.86"
httpx = "^0.28.1"
pydantic-settings = "^2.7.1"
requests = "^2.31.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
flake8 = "^7.0.0"  
flake8-import-order = "^0.18.0"
pytest = "^8.0.0"
mypy = "^1.13.0"
jsf = "^0.10.0"
ruff = "^0.8.0"

[tool.poetry.scripts]
makelabel = "pt750.main:main"

[[tool.mypy.overrides]]
module = "PIL"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsf"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "easysnmp"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "T20"]
ignore = ["E203", "E501"]  # Line length handled by black

[tool.ruff.per-file-ignores]
"tests/*" = ["T20"]  # Allow print in tests

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
